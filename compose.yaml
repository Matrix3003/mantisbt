services:
  app:
    build: .
    ports:
      - "${MANTIS_BIND_ADDRESS:-127.0.0.1}:${MANTIS_PORT:-8080}:80"
    environment:
      MANTIS_INSTALLER_ENABLED: "${MANTIS_INSTALLER_ENABLED:-0}"
    volumes:
      - mantis-config:/var/www/html/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: bugtracker
      MARIADB_USER: mantis
      MARIADB_PASSWORD: "${MANTIS_DB_PASSWORD:?Set MANTIS_DB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${MANTIS_DB_ROOT_PASSWORD:?Set MANTIS_DB_ROOT_PASSWORD in .env}"
    volumes:
      - mantis-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mantis-config:
  mantis-db:
